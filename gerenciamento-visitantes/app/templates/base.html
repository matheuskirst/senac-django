<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{% static 'visitors/css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>{% block title %}PARQUE DA OKTOBERFEST {% endblock %}</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">PARQUE DA OKTOBERFEST</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal"
                aria-controls="menu-principal" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu-principal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %} active {% endif %}" href="{% url 'home' %}">Início</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/visitors/create/' %} active {% endif %}" href="{% url 'create-visitor' %}">Cadastrar visitante</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/visitors/' %} active {% endif %}" href="{% url 'visitors' %}">Visitantes</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>

    <main class="container-fluid pt-2">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
