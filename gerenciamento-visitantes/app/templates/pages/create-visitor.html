{% extends 'base.html' %}

{% block title %}
Cadastrar Visitante
{% endblock %}

{% block content %}
<div>
    <h1>Cadastrar novo visitante</h1>
    <p>Use o formulário abaixo para cadastrar um novo visitante</p>
    
    <form action="./" method="post">
        {% csrf_token %}
        <label for="first_name" class="form-label">Nome</label>
        <input type="text" class="form-control" id="first_name" name="first_name" required>

        <label for="last_name" class="form-label">Sobrenome</label>
        <input type="text" class="form-control" id="last_name" name="last_name" required>

        <label for="cpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" name="cpf" required minlength="11" maxlength="11" placeholder="___.___.___-__">

        <label for="birthdate" class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" id="birthdate" name="birthdate" required>

        <label for="ticket_date" class="form-label">Data do Ingresso</label>
        <input type="date" class="form-control" id="ticket_date" name="ticket_date" required>

        <label for="ticket_type" class="form-label">Tipo de Ingresso</label>
        <select name="ticket_type" id="ticket_type" class="form-select" required>
            <option value="" selected disabled hidden>-- Selecione --</option>
            {% for value, label in TicketType.choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <input type="submit" value="Salvar" class="btn btn-success mt-3 btn-custom">
    </form>

    <a href="{% url 'visitors' %}" class="btn btn-outline-primary mt-3 btn-custom">Voltar</a>
</div>
{% endblock %}
