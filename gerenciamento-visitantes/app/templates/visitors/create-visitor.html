<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    {% load static %}
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{% static 'visitors/css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Adicionar Visitante</title>
</head>
<body>
    <header>
        {% include 'navbar.html' %}
    </header>

    <div class="container-fluid pt-5">
        <h1>Adicionar novo visitante</h1>
        <p>Use o formulário abaixo para adicionar um novo visitante</p>
        
        <form action="./" method="post">
            {% csrf_token %}
            <label for="first_name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="first_name" name="first_name"">

            <label for="last_name" class="form-label">Sobrenome</label>
            <input type="text" class="form-control" id="last_name" name="last_name">

            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf" placeholder="___.___.___-__">

            <label for="birthdate" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="birthdate" name="birthdate">

            <label for="ticket_date" class="form-label">Data do Ingresso</label>
            <input type="date" class="form-control" id="ticket_date" name="ticket_date">

            <label for="ticket_type" class="form-label">Tipo de Ingresso</label>
            <select name="ticket_type" id="ticket_type" class="form-select">
                <option value="" selected disabled hidden>-- Selecione --</option>
                <option value="1">Normal</option>
                <option value="2">VIP</option>
                <option value="3">Premium</option>
            </select>

            <input type="submit" value="Salvar" class="btn btn-success mt-3 btn-custom">
        </form>

        <a href="{% url 'visitors' %}" class="btn btn-outline-primary mt-3 btn-custom">Voltar</a>
    </div>
</body>
</html>
