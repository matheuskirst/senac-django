{% extends 'base.html' %}

{% block title %}
Atualizar Visitante
{% endblock %}

{% block content %}
<div>
    <h1>Atualizar cadastro de visitante</h1>
    <p>Use o formulário abaixo para atualizar o cadastro do visitante</p>
    
    <form action="./" method="post">
        {% csrf_token %}
        {% if visitor %}
        <label for="first_name" class="form-label">Nome</label>
        <input type="text" class="form-control" id="first_name" name="first_name" value="{{ visitor.first_name }}">

        <label for="last_name" class="form-label">Sobrenome</label>
        <input type="text" class="form-control" id="last_name" name="last_name" value="{{ visitor.last_name }}">

        <label for="cpf" class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" name="cpf" placeholder="___.___.___-__" value="{{ visitor.cpf }}">

        <label for="birthdate" class="form-label">Data de Nascimento</label>
        <input type="date" class="form-control" id="birthdate" name="birthdate" value="{{ visitor.birthdate|date:'Y-m-d' }}">

        <label for="ticket_date" class="form-label">Data do Ingresso</label>
        <input type="date" class="form-control" id="ticket_date" name="ticket_date" value="{{ visitor.ticket_date|date:'Y-m-d' }}">

        <label for="ticket_type" class="form-label">Tipo de Ingresso</label>
        <select name="ticket_type" id="ticket_type" class="form-select">
            <option value="" selected disabled hidden>-- Selecione --</option>
            <option value="1" {% if visitor.ticket_type == 1 %} selected {% endif %}>Normal</option>
            <option value="2" {% if visitor.ticket_type == 2 %} selected {% endif %}>VIP</option>
            <option value="3" {% if visitor.ticket_type == 3 %} selected {% endif %}>Premium</option>
        </select>
        {% endif %}

        <input type="submit" value="Atualizar" class="btn btn-success mt-3 btn-custom">
    </form>

    <a href="{% url 'visitors' %}" class="btn btn-outline-primary mt-3 btn-custom">Voltar</a>
</div>
{% endblock %}
